<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집중 타이머</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f7f5; --surface: #fff; --surface2: #f0f0ee;
    --border: rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.13);
    --text: #1a1a1a; --muted: #999; --muted2: #ccc;
    --green: #1a9e6a; --red: #d94f3d;
    --mono: 'DM Mono', monospace; --sans: 'Pretendard', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2.5rem 1rem 4rem; }
  .container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 1.25rem; }

  .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border2); }
  .header-title { font-size: 11px; letter-spacing: 0.18em; color: var(--muted); font-weight: 400; text-transform: uppercase; }
  .csv-btn { font-size: 10px; color: var(--muted); background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: var(--sans); transition: all 0.15s; }
  .csv-btn:hover { color: var(--text); border-color: rgba(0,0,0,0.22); }

  .timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem 1.5rem 1.75rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .circle-wrap { position: relative; width: 200px; height: 200px; }
  svg.ring { transform: rotate(-90deg); width: 200px; height: 200px; }
  .track { fill: none; stroke: #ebebeb; stroke-width: 5; }
  .arc { fill: none; stroke-width: 5; stroke-linecap: round; }
  .center-info { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .time-display { font-family: var(--mono); font-size: 50px; font-weight: 300; letter-spacing: -2px; color: var(--text); line-height: 1; }

  .controls { display: flex; align-items: center; gap: 10px; }
  .ctrl { background: transparent; border: 1px solid var(--border2); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.15s; }
  .ctrl:hover { border-color: rgba(0,0,0,0.22); color: var(--text); background: var(--surface2); }
  .ctrl-sm { width: 38px; height: 38px; }
  .ctrl-main { width: 56px; height: 56px; color: var(--text); border-color: rgba(0,0,0,0.18); }
  .ctrl svg { width: 18px; height: 18px; }
  .ctrl-main svg { width: 22px; height: 22px; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; gap: 5px; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
  .stat-val { font-family: var(--mono); font-size: 24px; font-weight: 400; color: var(--text); line-height: 1; }
  .stat-unit { font-size: 10px; color: var(--muted); }

  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .section-header { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .clear-btn { font-size: 10px; color: var(--muted2); background: none; border: none; cursor: pointer; font-family: var(--sans); transition: color 0.15s; }
  .clear-btn:hover { color: var(--muted); }

  .month-tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .month-tab { font-size: 11px; font-family: var(--sans); background: none; border: none; border-bottom: 2px solid transparent; padding: 7px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; transition: all 0.15s; margin-bottom: -1px; }
  .month-tab:hover { color: var(--text); }
  .month-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 500; }

  /* 세션 로그 - 날짜별 그룹 */
  .date-group { border-bottom: 1px solid var(--border); }
  .date-group:last-child { border-bottom: none; }
  .date-group-header { padding: 8px 16px; background: var(--surface2); display: flex; align-items: center; justify-content: space-between; }
  .date-group-label { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .date-group-summary { font-size: 11px; color: var(--green); font-family: var(--mono); }
  .session-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 0.5px solid var(--border); }
  .session-row:last-child { border-bottom: none; }
  .session-num { font-family: var(--mono); font-size: 10px; color: var(--muted2); width: 16px; flex-shrink: 0; text-align: right; }
  .session-time { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 38px; flex-shrink: 0; }
  .session-mins { font-family: var(--mono); font-size: 12px; color: var(--green); width: 30px; flex-shrink: 0; }
  .session-memo { font-size: 11px; color: var(--text); flex: 1; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-memo.editable { font-style: normal; background: transparent; border: none; border-bottom: 1px solid transparent; outline: none; font-family: var(--sans); color: var(--text); width: 100%; transition: border-color 0.15s; }
  .session-memo.editable:focus { border-bottom-color: var(--muted2); font-style: normal; }
  .session-del { background: none; border: none; cursor: pointer; color: var(--muted2); font-size: 16px; padding: 4px 6px; transition: color 0.15s; line-height: 1; border-radius: 4px; flex-shrink: 0; }
  .session-del:hover { color: var(--red); background: rgba(217,79,61,0.06); }

  /* 일별 누적 */
  .day-list { display: flex; flex-direction: column; }
  .day-row { padding: 9px 16px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .day-row:last-child { border-bottom: none; }
  .day-row.empty { opacity: 0.3; }
  .day-date { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 38px; flex-shrink: 0; }
  .day-bar-bg { flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .day-bar-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .day-bar-fill.today { box-shadow: 0 0 4px rgba(26,158,106,0.3); }
  .day-info { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 40px; text-align: right; flex-shrink: 0; }

  .empty-msg { font-size: 12px; color: var(--muted2); text-align: center; padding: 20px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text); border-radius: 8px; padding: 8px 18px; font-size: 12px; color: #fff; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; white-space: nowrap; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 종료 팝업 */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); align-items: center; justify-content: center; z-index: 200; }
  .overlay.visible { display: flex; }
  .popup { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 1.5rem; width: 300px; display: flex; flex-direction: column; gap: 1rem; }
  .popup-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .popup-sub { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .popup-input { width: 100%; font-size: 12px; font-family: var(--sans); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; outline: none; color: var(--text); background: var(--surface); }
  .popup-input:focus { border-color: rgba(0,0,0,0.25); }
  .popup-input::placeholder { color: var(--muted2); }
  .popup-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-cancel { font-size: 12px; font-family: var(--sans); background: transparent; border: 1px solid var(--border2); border-radius: 7px; padding: 7px 14px; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .btn-cancel:hover { color: var(--text); background: var(--surface2); }
  .btn-save { font-size: 12px; font-family: var(--sans); background: var(--green); border: none; border-radius: 7px; padding: 7px 14px; cursor: pointer; color: #fff; transition: opacity 0.15s; }
  .btn-save:hover { opacity: 0.88; }

  /* 완료 애니메이션 */
  @keyframes spin-once { from { stroke-dashoffset: 540; } to { stroke-dashoffset: 0; } }
  .arc-complete { animation: spin-once 0.7s cubic-bezier(0.4,0,0.2,1) forwards; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="header-title">Focus Timer</span>
    <button class="csv-btn" onclick="exportCSV()">CSV 내보내기</button>
  </div>

  <div class="timer-card">
    <div class="circle-wrap">
      <svg class="ring" viewBox="0 0 200 200">
        <circle id="fill-circle" cx="100" cy="100" r="83" fill="transparent"/>
        <circle class="track" cx="100" cy="100" r="86"/>
        <circle class="arc" id="arc" cx="100" cy="100" r="86" stroke="#1a9e6a" stroke-dasharray="540.4" stroke-dashoffset="540.4"/>
      </svg>
      <div class="center-info">
        <div class="time-display" id="display">00:00</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl ctrl-sm" onclick="resetTimer()" title="초기화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="ctrl ctrl-main" id="play-btn" onclick="toggleTimer()">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <button class="ctrl ctrl-sm" onclick="openEndConfirm()" title="종료 및 저장">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">오늘 세션</div>
      <div><span class="stat-val" id="today-count">0</span> <span class="stat-unit">회</span></div>
    </div>
    <div class="stat-box">
      <div class="stat-label">오늘 집중</div>
      <div><span class="stat-val" id="today-mins">0</span> <span class="stat-unit">분</span></div>
    </div>
    <div class="stat-box">
      <div class="stat-label">누적 집중</div>
      <div><span class="stat-val" id="total-mins">0</span> <span class="stat-unit">분</span></div>
    </div>
  </div>

  <!-- 세션 로그 -->
  <div class="section-card">
    <div class="section-header">
      <span class="section-title">세션 기록</span>
      <div style="display:flex;gap:10px;align-items:center;">
        <div class="month-tabs" id="session-month-tabs" style="border:none;margin:0;padding:0;"></div>
        <button class="clear-btn" onclick="clearMonthSessions()">이달 삭제</button>
      </div>
    </div>
    <div id="session-log">
      <div class="empty-msg">종료한 세션이 없어요</div>
    </div>
  </div>

  <!-- 일별 누적 -->
  <div class="section-card">
    <div class="section-header">
      <span class="section-title">일별 누적</span>
      <button class="clear-btn" onclick="clearAllHistory()">전체 삭제</button>
    </div>
    <div class="month-tabs" id="day-month-tabs"></div>
    <div class="day-list" id="day-list">
      <div class="empty-msg">아직 기록이 없어요</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-title">세션을 종료할까요?</div>
    <div class="popup-sub" id="popup-sub"></div>
    <input class="popup-input" id="popup-memo" type="text" placeholder="메모 (예: 시세 분석, 공급)" maxlength="40">
    <div class="popup-actions">
      <button class="btn-cancel" onclick="closeConfirm()">취소</button>
      <button class="btn-save" onclick="confirmEnd()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CIRC = 2 * Math.PI * 86;
const SESSION_KEY = 'pomo-sessions-v1';
const DAY_KEY     = 'pomo-days-v1';

let running = false, ticker = null, elapsedSec = 0;
let startTime = 0, pausedElapsed = 0;
let activeSessionMonth = null, activeDayMonth = null;

const pauseIcon = `<svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>`;
const playIcon  = `<svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><polygon points="5,3 19,12 5,21"/></svg>`;

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function thisMonthKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function loadSessions() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || []; } catch { return []; } }
function saveSessions(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function loadDays()      { try { return JSON.parse(localStorage.getItem(DAY_KEY)) || {}; } catch { return {}; } }
function saveDays(d)     { localStorage.setItem(DAY_KEY, JSON.stringify(d)); }

function addSession(mins, memo) {
  const sessions = loadSessions();
  sessions.push({ date: todayKey(), time: nowTime(), mins, memo: memo || '' });
  saveSessions(sessions);
  const days = loadDays();
  days[todayKey()] = (days[todayKey()] || 0) + mins;
  saveDays(days);
  renderAll();
}

function deleteSession(idx) {
  if (!confirm('이 세션을 삭제할까요?')) return;
  const sessions = loadSessions();
  const s = sessions[idx];
  if (!s) return;
  const days = loadDays();
  days[s.date] = Math.max(0, (days[s.date] || 0) - s.mins);
  if (days[s.date] === 0) delete days[s.date];
  saveDays(days);
  sessions.splice(idx, 1);
  saveSessions(sessions);
  renderAll();
}

function editMemo(idx, val) {
  const sessions = loadSessions();
  if (sessions[idx]) { sessions[idx].memo = val; saveSessions(sessions); }
}

function clearMonthSessions() {
  if (!confirm('이달 세션 기록을 삭제할까요?')) return;
  const m = activeSessionMonth || thisMonthKey();
  const sessions = loadSessions();
  const removed = sessions.filter(s => s.date.startsWith(m));
  const kept = sessions.filter(s => !s.date.startsWith(m));
  saveSessions(kept);
  const days = loadDays();
  removed.forEach(s => {
    days[s.date] = Math.max(0, (days[s.date] || 0) - s.mins);
    if (days[s.date] === 0) delete days[s.date];
  });
  saveDays(days);
  renderAll();
}

function clearAllHistory() {
  if (!confirm('전체 기록을 삭제할까요?')) return;
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(DAY_KEY);
  renderAll();
}

function getMonths(sessions, days) {
  const set = new Set();
  sessions.forEach(s => set.add(s.date.slice(0,7)));
  Object.keys(days).forEach(k => set.add(k.slice(0,7)));
  set.add(thisMonthKey());
  return Array.from(set).sort().reverse();
}

function monthLabel(m) {
  const [y, mo] = m.split('-');
  return parseInt(y) + '년 ' + parseInt(mo) + '월';
}

function renderAll() {
  renderStats();
  renderSessionLog();
  renderDayHistory();
}

function renderStats() {
  const sessions = loadSessions();
  const key = todayKey();
  const todaySessions = sessions.filter(s => s.date === key);
  document.getElementById('today-count').textContent = todaySessions.length;
  document.getElementById('today-mins').textContent  = todaySessions.reduce((a,s) => a+s.mins, 0);
  const days = loadDays();
  document.getElementById('total-mins').textContent  = Object.values(days).reduce((a,v) => a+v, 0);
}

function renderSessionLog() {
  const sessions = loadSessions();
  const days = loadDays();
  const months = getMonths(sessions, days);
  if (!activeSessionMonth || !months.includes(activeSessionMonth)) activeSessionMonth = months[0];

  // 월 탭
  const tabEl = document.getElementById('session-month-tabs');
  tabEl.innerHTML = months.map(m =>
    `<button class="month-tab ${m===activeSessionMonth?'active':''}" onclick="activeSessionMonth='${m}';renderSessionLog()">${monthLabel(m)}</button>`
  ).join('');

  const filtered = sessions
    .map((s,i) => ({...s, origIdx:i}))
    .filter(s => s.date.startsWith(activeSessionMonth));

  const el = document.getElementById('session-log');
  if (filtered.length === 0) { el.innerHTML = '<div class="empty-msg">이달 세션이 없어요</div>'; return; }

  // 날짜별 그룹
  const groups = {};
  filtered.forEach(s => { if (!groups[s.date]) groups[s.date]=[]; groups[s.date].push(s); });
  const sortedDates = Object.keys(groups).sort().reverse();

  el.innerHTML = sortedDates.map(date => {
    const items = groups[date];
    const totalMins = items.reduce((a,s) => a+s.mins, 0);
    const [,mo,d] = date.split('-');
    const dateLabel = parseInt(mo) + '월 ' + parseInt(d) + '일';
    const rows = items.map((s, n) => `
      <div class="session-row">
        <span class="session-num">${n+1}</span>
        <span class="session-time">${s.time}</span>
        <span class="session-mins">${s.mins}분</span>
        <input class="session-memo editable" value="${(s.memo||'').replace(/"/g,'&quot;')}" placeholder="메모 없음"
          onchange="editMemo(${s.origIdx}, this.value)"
          onblur="editMemo(${s.origIdx}, this.value)"
          maxlength="40">
        <button class="session-del" onclick="deleteSession(${s.origIdx})" title="삭제">×</button>
      </div>`).join('');
    return `
      <div class="date-group">
        <div class="date-group-header">
          <span class="date-group-label">${dateLabel} · ${items.length}세션</span>
          <span class="date-group-summary">${totalMins}분</span>
        </div>
        ${rows}
      </div>`;
  }).join('');
}

function renderDayHistory() {
  const sessions = loadSessions();
  const days = loadDays();
  const months = getMonths(sessions, days);
  if (!activeDayMonth || !months.includes(activeDayMonth)) activeDayMonth = months[0];

  const tabEl = document.getElementById('day-month-tabs');
  tabEl.innerHTML = months.map(m =>
    `<button class="month-tab ${m===activeDayMonth?'active':''}" onclick="activeDayMonth='${m}';renderDayHistory()">${monthLabel(m)}</button>`
  ).join('');

  const today = new Date();
  const todayStr = todayKey();
  const [ay, am] = activeDayMonth.split('-').map(Number);
  const daysInMonth = new Date(ay, am, 0).getDate();
  const rows = [];
  for (let d = daysInMonth; d >= 1; d--) {
    const k = ay + '-' + String(am).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    if (new Date(k) > today) continue;
    const mins = days[k] || 0;
    const isToday = k === todayStr;
    const label = isToday ? '오늘' : am + '/' + d;
    rows.push({ k, label, mins, isToday, empty: mins===0 });
  }

  const el = document.getElementById('day-list');
  if (rows.length === 0) { el.innerHTML = '<div class="empty-msg">이달 기록이 없어요</div>'; return; }

  const maxMins = Math.max(...rows.map(r => r.mins), 1);
  el.innerHTML = rows.map(r => `
    <div class="day-row${r.empty?' empty':''}">
      <div class="day-date">${r.label}</div>
      <div class="day-bar-bg">
        <div class="day-bar-fill${r.isToday?' today':''}" style="width:${r.mins>0?Math.round(r.mins/maxMins*100):0}%"></div>
      </div>
      <div class="day-info">${r.mins>0?r.mins+'분':'—'}</div>
    </div>`).join('');
}

// CSV 내보내기
function exportCSV() {
  const sessions = loadSessions();
  if (sessions.length === 0) { showToast('내보낼 기록이 없어요'); return; }
  const header = '날짜,시간,집중(분),메모';
  const rows = sessions.map(s => `${s.date},${s.time},${s.mins},"${(s.memo||'').replace(/"/g,'""')}"`);
  const csv = [header, ...rows].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'focus_log.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 저장됨');
}

// 타이머
function lerpColor(a, b, t) {
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
}

function render() {
  const m = Math.floor(elapsedSec/60), s = elapsedSec%60;
  document.getElementById('display').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  const MAX = 60*60;
  const p = Math.min(elapsedSec/MAX, 1);
  document.getElementById('arc').style.strokeDashoffset = CIRC * (1-p);
  const c = p < 0.5 ? lerpColor([234,248,237],[167,220,190],p*2) : lerpColor([167,220,190],[26,158,106],(p-0.5)*2);
  document.getElementById('fill-circle').setAttribute('fill', c);
  document.getElementById('fill-circle').style.opacity = 0.05 + p*0.6;
}

function resetPhase() {
  elapsedSec = 0; startTime = 0; pausedElapsed = 0; running = false;
  document.getElementById('fill-circle').setAttribute('fill', 'transparent');
  document.getElementById('fill-circle').style.opacity = 0;
  const arc = document.getElementById('arc');
  arc.style.transition = '';
  arc.style.strokeDashoffset = CIRC;
  document.getElementById('display').textContent = '00:00';
}

function toggleTimer() {
  if (running) {
    clearInterval(ticker); running = false;
    elapsedSec = pausedElapsed + Math.floor((Date.now()-startTime)/1000);
    document.getElementById('play-btn').innerHTML = playIcon;
  } else {
    startTime = Date.now();
    pausedElapsed = elapsedSec;
    running = true;
    document.getElementById('play-btn').innerHTML = pauseIcon;
    ticker = setInterval(() => {
      elapsedSec = pausedElapsed + Math.floor((Date.now()-startTime)/1000);
      render();
    }, 500);
  }
}

function resetTimer() {
  clearInterval(ticker);
  document.getElementById('play-btn').innerHTML = playIcon;
  resetPhase();
}

function openEndConfirm() {
  if (elapsedSec === 0) { showToast('아직 집중 시간이 없어요'); return; }
  const mins = Math.ceil(elapsedSec/60);
  document.getElementById('popup-sub').textContent = `${mins}분 집중했어요. 메모를 남겨주세요.`;
  document.getElementById('popup-memo').value = '';
  document.getElementById('overlay').classList.add('visible');
  setTimeout(() => document.getElementById('popup-memo').focus(), 100);
}

function closeConfirm() {
  document.getElementById('overlay').classList.remove('visible');
}

function confirmEnd() {
  const mins = Math.ceil(elapsedSec/60);
  const memo = document.getElementById('popup-memo').value.trim();
  closeConfirm();
  clearInterval(ticker);
  document.getElementById('play-btn').innerHTML = playIcon;

  // 완료 애니메이션
  const arc = document.getElementById('arc');
  arc.style.transition = 'none';
  arc.style.strokeDashoffset = CIRC;
  setTimeout(() => {
    arc.style.transition = 'stroke-dashoffset 0.7s cubic-bezier(0.4,0,0.2,1)';
    arc.style.strokeDashoffset = 0;
  }, 50);

  playAlert();

  if (mins > 0) {
    addSession(mins, memo);
    showToast(`${mins}분 저장됨 🎉`);
  }
  setTimeout(() => resetPhase(), 900);
}

function playAlert() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      const t = ctx.currentTime + i*0.18;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.35, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.4);
      osc.start(t); osc.stop(t+0.4);
    });
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

renderAll(); resetPhase();
</script>
</body>
</html>
